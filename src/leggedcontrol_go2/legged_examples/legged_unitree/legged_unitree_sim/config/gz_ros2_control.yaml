controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    FR_foot_fts_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    FL_foot_fts_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    RR_foot_fts_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    RL_foot_fts_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    legged_controller:
      # Stable public Gazebo controller: MPC/WBC with exact simulated base
      # odometry. Joint and F/T state still come through ros2_control.
      type: legged/LeggedCheaterController

    legged_kalman_controller:
      # Kept for explicit estimator development; this estimator currently
      # diverges during alternating diagonal support in Gazebo.
      type: legged/LeggedController

    legged_cheater_controller:
      type: legged/LeggedCheaterController

    joint_group_effort_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gz_ros_control:
  ros__parameters:
    hold_joints: false
    position_proportional_gain: 0.0

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

imu_sensor_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: unitree_imu
    frame_id: unitree_imu

FR_foot_fts_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: FR_foot_fts
    frame_id: RF_FOOT

FL_foot_fts_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: FL_foot_fts
    frame_id: LF_FOOT

RR_foot_fts_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: RR_foot_fts
    frame_id: RH_FOOT

RL_foot_fts_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: RL_foot_fts
    frame_id: LH_FOOT

joint_group_effort_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - LF_HAA
      - LF_HFE
      - LF_KFE
      - RF_HAA
      - RF_HFE
      - RF_KFE
      - LH_HAA
      - LH_HFE
      - LH_KFE
      - RH_HAA
      - RH_HFE
      - RH_KFE
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
    gains:
      LF_HAA: {p: 80.0, i: 0.0, d: 1.0}
      LF_HFE: {p: 80.0, i: 0.0, d: 1.0}
      LF_KFE: {p: 80.0, i: 0.0, d: 1.0}
      LH_HAA: {p: 80.0, i: 0.0, d: 1.0}
      LH_HFE: {p: 80.0, i: 0.0, d: 1.0}
      LH_KFE: {p: 80.0, i: 0.0, d: 1.0}
      RF_HAA: {p: 80.0, i: 0.0, d: 1.0}
      RF_HFE: {p: 80.0, i: 0.0, d: 1.0}
      RF_KFE: {p: 80.0, i: 0.0, d: 1.0}
      RH_HAA: {p: 80.0, i: 0.0, d: 1.0}
      RH_HFE: {p: 80.0, i: 0.0, d: 1.0}
      RH_KFE: {p: 80.0, i: 0.0, d: 1.0}
